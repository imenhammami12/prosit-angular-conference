<section class="card" id="notifications">
  <div class="icon">🔔</div>

  <div class="notification-content">
    <h2>Zone de notifications</h2>

    <p>Vous avez {{ notificationList().length }} nouvelles notifications.</p>

    <button class="notification-btn" (click)="showNotifications()">
      {{ bTnTxt }}
    </button>

    @if (show()) {
      @for (item of notificationList(); track item) {
        <p class="notification">{{ item.message }}</p>
      }
    }
  </div>
</section>
