<section class="section-card conf-section" style="--accent: #0f766e; --accent-soft: #e0f7f5">
  <div class="section-body">
    <div class="conf-header">
      <div class="section-icon">📅</div>
      <div>
        <h2>Liste des conférences à venir</h2>
        <p class="hint">Cliquez sur une conférence pour afficher ses détails.</p>
      </div>
    </div>

    <!-- Aucune conférence enregistrée -->

      <p class="empty">Aucune conférence n'est enregistrée pour le moment.</p>

      <!-- Two-way data binding : la saisie met à jour searchTerm et la liste se filtre -->
      <input
        class="search"
        type="text"
        placeholder="Taper le titre de la conférence"

      />

      <div class="grid">
          <article class="conf-card" >
            <!-- Pipe uppercase : affichage en majuscules sans modifier la donnée -->
            <h3>Conf TITLE</h3>

            <!-- Pipe date : formatage de la date -->
            <p><strong>Date :</strong> </p>
            <p><strong>Lieu :</strong> </p>
            <p><strong>Places restantes :</strong></p>


              <p class="details"></p>
              <p class="details">Participants : </p>
            <button
              class="btn">
              S'inscrire
            </button>
          </article>
      </div>
  </div>
</section>
